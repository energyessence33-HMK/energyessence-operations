name: CI/CD Pipeline - Kingdom Executor Studio

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20.x"
  PNPM_VERSION: "9.12.0"

jobs:
  # Phase 1: Code Quality & Testing
  quality-checks:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: TypeScript type check
        run: pnpm type-check
      
      - name: Lint code
        run: pnpm lint
      
      - name: Run tests
        run: pnpm test
      
      - name: Test coverage
        run: pnpm test:coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  # Phase 2: Build Verification
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: quality-checks
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build project
        run: pnpm build
      
      - name: Verify build output
        run: |
          if [ -d "dist" ]; then
            echo "✅ Build successful"
            du -sh dist/
          else
            echo "❌ Build failed - no dist directory"
            exit 1
          fi

  # Phase 3: Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Phase 4: Deployment (Main branch only)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [quality-checks, build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build for production
        run: pnpm build
      
      - name: Deploy to Vercel
        uses: vercel/action@v5
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          production: true

  # Phase 5: Notifications
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [quality-checks, build, security, deploy]
    if: always()
    
    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.quality-checks.result }}" = "failure" ] || \
             [ "${{ needs.build.result }}" = "failure" ] || \
             [ "${{ needs.security.result }}" = "failure" ] || \
             [ "${{ needs.deploy.result }}" = "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          fi
      
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ steps.status.outputs.emoji }} Kingdom Executor Studio - CI/CD Pipeline",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ steps.status.outputs.emoji }} Kingdom Executor Studio - CI/CD Pipeline*\n*Status:* ${{ steps.status.outputs.status }}\n*Branch:* ${{ github.ref }}\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Author:* ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # Phase 6: Update Notion
  notion-sync:
    name: Sync to Notion
    runs-on: ubuntu-latest
    needs: [quality-checks, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Update Notion database
        run: |
          curl -X PATCH https://api.notion.com/v1/pages/${{ secrets.NOTION_PAGE_ID }} \
            -H "Authorization: Bearer ${{ secrets.NOTION_API_TOKEN }}" \
            -H "Notion-Version: 2022-06-28" \
            -d '{
              "properties": {
                "Status": {
                  "select": {
                    "name": "Deployed"
                  }
                },
                "Last Deployment": {
                  "date": {
                    "start": "'$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')'",
                    "end": null
                  }
                },
                "Commit": {
                  "rich_text": [
                    {
                      "type": "text",
                      "text": {
                        "content": "${{ github.sha }}"
                      }
                    }
                  ]
                }
              }
            }'

# Summary
# -------
# This CI/CD pipeline provides:
#
# 1. Code Quality Checks
#    - TypeScript type checking
#    - ESLint linting
#    - Unit tests (vitest)
#    - Code coverage reporting
#
# 2. Build Verification
#    - Production build verification
#    - Output validation
#
# 3. Security Scanning
#    - Vulnerability scanning (Trivy)
#    - GitHub Security tab integration
#
# 4. Deployment
#    - Automatic deployment to Vercel on main branch
#    - Production environment configuration
#
# 5. Notifications
#    - Slack notifications for all pipeline events
#    - Real-time status updates
#
# 6. Notion Sync
#    - Automatic Notion database updates
#    - Deployment tracking
#
# Required Secrets (GitHub Settings → Secrets):
# - VERCEL_TOKEN
# - VERCEL_ORG_ID
# - VERCEL_PROJECT_ID
# - SLACK_WEBHOOK_URL
# - NOTION_API_TOKEN
# - NOTION_PAGE_ID
